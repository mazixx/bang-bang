<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bão Thép — Đại Chiến Xe Tăng</title>

<style>
:root{
    --gold:#ffe9aa;
    --ink:#26434f;
    --blue:#286b88;
}
*{box-sizing:border-box}
html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    background:#102d40;font-family:Arial,sans-serif;color:white
}
body{display:flex;align-items:center;justify-content:center}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:not-allowed}
#stage{
    position:relative;width:1200px;height:760px;flex-shrink:0;
    overflow:hidden;transform-origin:center;
    background:#82d8e2;border-radius:15px;
    box-shadow:0 15px 70px #0008
}
#game{
    display:block;width:1200px;height:760px;
    touch-action:none;user-select:none;
    -webkit-user-select:none;-webkit-touch-callout:none
}
#hud{
    position:absolute;top:12px;left:15px;right:15px;
    display:flex;gap:10px;align-items:flex-start;
    pointer-events:none;z-index:3
}
#hud>*{pointer-events:auto}
.profile{
    width:230px;min-height:62px;text-align:left;
    padding:8px 13px;border:3px solid #efd18a;border-radius:14px;
    background:linear-gradient(#386a74,#204a59);color:white;
    box-shadow:0 4px 0 #79603f
}
.profile strong{display:block;font-size:18px}
.profile small{display:block;margin-top:5px;color:#ffe49c}
.wallet{
    display:flex;gap:8px;justify-content:center;flex:1
}
.pill{
    min-width:143px;padding:10px 14px;border-radius:24px;
    border:2px solid #e9e6b6;background:#255363ed;
    box-shadow:0 3px 0 #254553;font-weight:bold;font-size:17px
}
.pill span{margin-right:7px;font-size:22px}
.tools{display:flex;gap:7px}
.tool{
    width:43px;height:43px;border-radius:12px;
    border:2px solid #fff0bc;background:linear-gradient(#65a4b6,#31617e);
    color:white;font-size:21px;box-shadow:0 3px 0 #244353
}
#lobbyUI{position:absolute;inset:0;pointer-events:none}
#lobbyUI button,#lobbyUI input{pointer-events:auto}
#side{
    position:absolute;right:15px;top:115px;
    display:flex;flex-direction:column;gap:12px
}
.sidebtn{
    width:83px;height:78px;border:3px solid #ffedb6;border-radius:18px;
    background:linear-gradient(#eaffd0,#85cd8b);color:#2c6148;
    box-shadow:0 4px 0 #437755;font-weight:bold
}
.sidebtn b{display:block;font-size:29px;margin-bottom:4px}
#dock{
    position:absolute;bottom:15px;left:15px;right:15px;
    display:flex;justify-content:space-between;align-items:flex-end
}
.brand{
    border:2px solid #ceeeec;border-radius:13px;
    background:#194453ed;padding:11px 16px;box-shadow:0 4px 0 #143444
}
.brand strong{font-size:24px;color:#ffe795;letter-spacing:2px}
.brand small{display:block;margin-top:4px;font-size:12px;color:#d4f5fa}
.dockgroup{display:flex;gap:9px}
.dockbtn{
    min-width:102px;height:69px;border-radius:16px;
    border:3px solid #fff0bc;background:linear-gradient(#fff1af,#eab15a);
    color:#5f422b;box-shadow:0 5px 0 #90643e;font-weight:bold
}
.dockbtn b{display:block;font-size:27px;margin-bottom:2px}
.dockbtn:hover,.sidebtn:hover{filter:brightness(1.08)}
#chat{
    position:absolute;bottom:97px;left:15px;
    width:326px;border:2px solid #b4dce0;border-radius:12px;
    overflow:hidden;background:#173e50c9
}
.chathead{
    padding:7px 11px;background:#295b6ccd;
    font-weight:bold;color:#fff0b1;font-size:13px
}
#chatlog{
    height:85px;overflow:auto;padding:8px 11px;
    font-size:13px;line-height:1.6;pointer-events:auto
}
#chatlog div{color:#d8f4ee}
#chatlog .reward{color:#ffe68b}
.chatinput{display:flex;background:#d6f5f0;padding:5px;gap:5px}
#chatInput{
    width:100%;min-width:0;border:0;outline:none;
    border-radius:7px;padding:7px;color:#264754;font-size:13px
}
#chatSend{
    border:0;border-radius:7px;background:#3881a0;color:white;
    padding:5px 10px;font-weight:bold
}
#battleUI{display:none;position:absolute;inset:0;pointer-events:none}
#battleUI button,#battleUI input{pointer-events:auto}
#scorebar{
    position:absolute;top:88px;left:20px;right:20px;
    display:flex;justify-content:space-between;align-items:center
}
.badge{
    border:2px solid #c2edf0;background:#163e54e8;
    padding:9px 16px;border-radius:18px;box-shadow:0 3px 0 #193647;
    font-weight:bold;font-size:16px
}
#matchScore{min-width:360px;text-align:center}
#playerStatus{
    position:absolute;left:20px;top:140px;width:260px;
    background:#183f50cc;border:1px solid #a5d4d9;
    border-radius:12px;padding:9px 12px;font-size:14px
}
.hpbar{height:13px;background:#122d3c;border-radius:8px;overflow:hidden;margin:6px 0}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#57bf99,#cbef86)}
#statusText{font-size:12px;color:#d3f6f7}
#joystick{
    position:absolute;left:30px;bottom:34px;width:132px;height:132px;
    border:3px solid #c3eff5a6;border-radius:50%;
    background:radial-gradient(#9ed9e72b,#224b67b0);
    box-shadow:inset 0 0 20px #102d4780;
    pointer-events:auto;touch-action:none
}
#joystick:before{
    content:"";position:absolute;inset:25px;border-radius:50%;
    border:1px dashed #e0f9fa70
}
#stick{
    position:absolute;width:57px;height:57px;left:34.5px;top:34.5px;
    border:3px solid #dcffff;border-radius:50%;
    background:linear-gradient(#a2e4ed,#4b91ae);
    box-shadow:0 4px 8px #0005;pointer-events:none
}
#moveLabel{
    position:absolute;left:45px;bottom:12px;color:#c5edf1;
    font-size:12px;font-weight:bold
}
#combatActions{
    position:absolute;right:25px;bottom:27px;display:flex;
    gap:11px;align-items:flex-end
}
.skillcol{display:flex;flex-direction:column;gap:8px}
.skill{
    width:105px;height:54px;border:2px solid #c8f6ef;border-radius:13px;
    background:linear-gradient(#4582a0,#254a6e);color:white;
    box-shadow:0 3px 0 #153149;font-weight:bold;font-size:13px
}
#fire{
    width:128px;height:128px;border-radius:50%;
    border:5px solid #ffebac;background:radial-gradient(#ffdc68,#f18a35,#b94c2a);
    color:#632e1b;font-size:25px;font-weight:900;
    box-shadow:0 6px 0 #743721,0 0 24px #ffc24733;
    touch-action:none
}
#fire:active{filter:brightness(1.12)}
#aimButton{
    position:absolute;bottom:31px;left:185px;
    padding:12px 17px;border:2px solid #d5f7ef;border-radius:14px;
    background:#24516de8;color:white;font-weight:bold
}
#battleHint{
    position:absolute;bottom:8px;left:350px;right:280px;
    text-align:center;color:#ddf9ff;font-size:12px;
    text-shadow:0 2px 3px #102c40
}
#toast{
    position:absolute;top:225px;left:50%;transform:translateX(-50%);
    max-width:890px;border:2px solid #ffe4a0;border-radius:22px;
    background:#173e53ef;color:#fff3c2;padding:12px 24px;
    font-weight:bold;text-align:center;box-shadow:0 5px 20px #0004;
    opacity:0;transition:opacity .15s;pointer-events:none;z-index:8
}
#overlay{
    position:absolute;inset:0;background:#102d40aa;
    backdrop-filter:blur(4px);display:none;
    align-items:center;justify-content:center;z-index:10
}
.modal{
    width:960px;max-height:640px;border:5px solid #eed18d;
    border-radius:22px;background:linear-gradient(#f6faec,#dfeee6);
    color:#294955;overflow:hidden;
    box-shadow:0 8px 0 #866447,0 25px 65px #0006
}
.modalhead{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 20px;background:linear-gradient(#487f91,#2c536d);
    color:#fff0bf;border-bottom:3px solid #e9d299
}
.modalhead h2{margin:0;font-size:25px}
.close{
    width:39px;height:37px;border:2px solid #ffd7af;border-radius:10px;
    background:#b66652;color:white;font-size:24px;font-weight:bold
}
#content{padding:20px;max-height:546px;overflow:auto;line-height:1.5;overscroll-behavior:contain}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
    border:2px solid #bfd8ce;border-radius:15px;background:#ffffffe0;
    padding:16px;box-shadow:0 4px 0 #b6ccc5
}
.card h3{margin:6px 0 10px;color:#345d70;font-size:20px}
.card p{margin:8px 0 12px}
.icon{font-size:39px}
.note{
    border:1px solid #bdd39c;background:#e8f2d3;border-radius:12px;
    padding:12px 15px;margin-bottom:16px
}
.muted{font-size:13px;color:#66828a}
.price{color:#a37622;font-weight:bold}
.action{
    padding:10px 16px;border:2px solid #fff3c8;border-radius:10px;
    background:linear-gradient(#ffdc81,#e7ac51);color:#61422c;
    box-shadow:0 3px 0 #a57741;font-weight:bold
}
.action.blue{
    background:linear-gradient(#96e4e9,#50acc4);color:#234c62;
    border-color:#ddffff;box-shadow:0 3px 0 #4b8190
}
.action.red{
    background:linear-gradient(#f9b4a3,#dc806b);color:#733b30;
    box-shadow:0 3px 0 #a85f51
}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.progress{height:12px;border-radius:10px;background:#d4e2da;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#58b89b,#b2df78)}
.stat{font-size:29px;font-weight:bold;color:#34798c}
.nameinput{
    width:100%;padding:11px;border:2px solid #b9d6ce;
    border-radius:9px;color:#2d5161;background:white
}
#rotate{
    position:fixed;bottom:6px;left:0;right:0;display:none;
    text-align:center;font-size:12px;color:#ddf6fa;pointer-events:none
}
</style>
</head>

<body>
<div id="stage">
    <canvas id="game" width="1200" height="760"></canvas>

    <div id="hud">
        <button class="profile" data-a="profile">
            <strong id="name"></strong>
            <small id="level"></small>
        </button>

        <div class="wallet">
            <div class="pill"><span>⚡</span><b id="energy"></b></div>
            <div class="pill"><span>🪙</span><b id="gold"></b></div>
            <div class="pill"><span>💎</span><b id="gems"></b></div>
        </div>

        <div class="tools">
            <button class="tool" data-a="sound" id="sound">🔊</button>
            <button class="tool" data-a="fullscreen">⛶</button>
            <button class="tool" data-a="help">?</button>
        </div>
    </div>

    <div id="lobbyUI">
        <div id="side">
            <button class="sidebtn" data-a="daily"><b>🎁</b>Quà ngày</button>
            <button class="sidebtn" data-a="quests"><b>📜</b>Nhiệm vụ</button>
            <button class="sidebtn" data-a="records"><b>🏅</b>Thành tích</button>
        </div>

        <div id="chat">
            <div class="chathead">HỆ THỐNG • Ghi chú cục bộ, không phải chat online</div>
            <div id="chatlog"></div>
            <div class="chatinput">
                <input id="chatInput" maxlength="100"
                       placeholder="Ghi chú của bạn...">
                <button id="chatSend">Gửi</button>
            </div>
        </div>

        <div id="dock">
            <div class="brand">
                <strong>BÃO THÉP</strong>
                <small>Đại chiến xe tăng • Offline • Lưu trên trình duyệt</small>
            </div>

            <div class="dockgroup">
                <button class="dockbtn" data-a="shop"><b>🛒</b>Cửa hàng</button>
                <button class="dockbtn" data-a="tanks"><b>🚜</b>Xe tăng</button>
                <button class="dockbtn" data-a="quests"><b>📜</b>Nhiệm vụ</button>
                <button class="dockbtn" data-a="battle"><b>⚔️</b>Chiến đấu</button>
            </div>
        </div>
    </div>

    <div id="battleUI">
        <div id="scorebar">
            <div class="badge" id="modeLabel"></div>
            <div class="badge" id="matchScore"></div>
            <button class="tool" style="width:94px;font-size:14px"
                    data-a="leave">Rời trận</button>
        </div>

        <div id="playerStatus">
            <b id="hpText"></b>
            <div class="hpbar"><i id="hpFill"></i></div>
            <div id="statusText"></div>
        </div>

        <div id="joystick"><div id="stick"></div></div>
        <div id="moveLabel">JOYSTICK DI CHUYỂN</div>

        <button id="aimButton" data-a="aim">🎯 Ngắm tự động</button>

        <div id="combatActions">
            <div class="skillcol">
                <button class="skill" id="dash" data-a="dash">💨 Tăng tốc</button>
                <button class="skill" id="shield" data-a="shield">🛡️ Lá chắn</button>
                <button class="skill" id="repair" data-a="repair">🔧 Sửa chữa</button>
            </div>
            <button id="fire">BẮN<br>GIỮ</button>
        </div>

        <div id="battleHint">
            WASD / joystick: di chuyển • Chuột / chạm: ngắm • Giữ BẮN / Space
        </div>
    </div>

    <div id="toast"></div>

    <div id="overlay">
        <div class="modal">
            <div class="modalhead">
                <h2 id="title"></h2>
                <button class="close" data-a="close">×</button>
            </div>
            <div id="content"></div>
        </div>
    </div>
</div>

<div id="rotate">📱 Xoay ngang điện thoại để chơi thuận tiện hơn.</div>

<script>
"use strict";

/* ============================================================
   BÃO THÉP
   Game offline tự chứa: Canvas, bot, joystick, localStorage.
   Không thư viện, không ảnh ngoài, không thanh toán tiền thật.
   ============================================================ */

const W=1200,H=760,MW=1800,MH=1150;
const KEY="bao_thep_save_v1";
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rand=(a,b)=>a+Math.random()*(b-a);
const money=n=>Math.floor(n).toLocaleString("vi-VN");
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
}[c]));

const TANKS=[
    {
        id:"rookie",name:"Tiên Phong",icon:"🚜",
        color:"#e5c55d",hp:150,speed:175,
        damage:23,rate:.43,bulletSpeed:540,
        blast:0,pellets:1,cost:0,
        desc:"Cân bằng, dễ điều khiển, phù hợp mọi trận."
    },
    {
        id:"scout",name:"Tia Chớp",icon:"⚡",
        color:"#75d69f",hp:118,speed:224,
        damage:17,rate:.28,bulletSpeed:590,
        blast:0,pellets:1,cost:650,
        desc:"Nhanh và bắn liên tục, nhưng giáp mỏng."
    },
    {
        id:"fortress",name:"Thiết Giáp",icon:"🛡️",
        color:"#8ebbdc",hp:225,speed:137,
        damage:30,rate:.59,bulletSpeed:490,
        blast:0,pellets:1,cost:850,
        desc:"Máu cao, hỏa lực mạnh, cơ động thấp."
    },
    {
        id:"bomber",name:"Hỏa Bão",icon:"💥",
        color:"#ec996f",hp:160,speed:160,
        damage:42,rate:.88,bulletSpeed:410,
        blast:67,pellets:1,cost:1100,
        desc:"Đạn nổ lan, phá thùng và đánh nhóm mục tiêu."
    },
    {
        id:"plasma",name:"Lam Quang",icon:"🔷",
        color:"#ad8de3",hp:142,speed:183,
        damage:34,rate:.62,bulletSpeed:790,
        blast:0,pellets:1,cost:1250,
        desc:"Đạn năng lượng tốc độ cao, mạnh ở tầm xa."
    }
];

function day(){
    const d=new Date();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function initialSave(){
    return{
        name:"Chỉ Huy Mới",gold:1100,gems:20,
        energy:190,energyAt:Date.now(),
        level:1,xp:0,tank:"rookie",owned:["rookie"],
        upgrades:{rookie:0,scout:0,fortress:0,bomber:0,plasma:0},
        sound:true,daily:"",activity:"",
        claimed:[],
        stats:{
            played:0,wins:0,kills:0,damage:0,
            boss:0,upgrades:0,best:0
        }
    };
}

function load(){
    const base=initialSave();
    try{
        const r=JSON.parse(localStorage.getItem(KEY)||"null");
        if(!r||typeof r!=="object")return base;

        for(const k of ["gold","gems","energy","level","xp"]){
            if(Number.isFinite(r[k]))base[k]=Math.floor(Math.max(0,r[k]));
        }
        base.energy=clamp(base.energy,0,200);
        base.level=clamp(base.level,1,999);

        if(typeof r.name==="string")
            base.name=r.name.trim().slice(0,18)||base.name;

        if(Array.isArray(r.owned))
            base.owned=[...new Set(["rookie",...r.owned.filter(
                id=>TANKS.some(t=>t.id===id)
            )])];

        if(base.owned.includes(r.tank))base.tank=r.tank;

        if(r.upgrades&&typeof r.upgrades==="object"){
            for(const t of TANKS){
                if(Number.isFinite(r.upgrades[t.id]))
                    base.upgrades[t.id]=clamp(Math.floor(r.upgrades[t.id]),0,5);
            }
        }

        if(r.stats&&typeof r.stats==="object"){
            for(const k of Object.keys(base.stats)){
                if(Number.isFinite(r.stats[k]))
                    base.stats[k]=Math.floor(Math.max(0,r.stats[k]));
            }
        }

        if(Number.isFinite(r.energyAt))
            base.energyAt=clamp(r.energyAt,0,Date.now());

        for(const k of ["daily","activity"])
            if(typeof r[k]==="string")base[k]=r[k];

        if(Array.isArray(r.claimed))
            base.claimed=r.claimed.filter(v=>typeof v==="string");

        base.sound=r.sound!==false;
    }catch(e){
        console.warn("Dùng tiến trình mới.",e);
    }
    return base;
}

let S=load();
let scene="lobby",B=null,time=0;
let modal=false,onClose=null,hover=null;
let toastEnd=0,storageWarned=false;
let audio=null,lastSound=0;
let canvasPointer=null,stickPointer=null;

const input={
    x:0,y:0,fire:false,mouseFire:false,
    auto:true,aimX:900,aimY:500
};
const keys={};

function fit(){
    const portrait=innerHeight>innerWidth;
    const s=Math.min(innerWidth/W,(innerHeight-(portrait?28:0))/H);
    $("stage").style.transform=`scale(${s})`;
    $("rotate").style.display=portrait?"block":"none";
}
addEventListener("resize",fit);
document.addEventListener("fullscreenchange",fit);
fit();

const DPR=Math.min(devicePixelRatio||1,1.5);
canvas.width=Math.round(W*DPR);
canvas.height=Math.round(H*DPR);
ctx.setTransform(DPR,0,0,DPR,0,0);

function hud(){
    $("name").textContent=S.name;
    $("level").textContent=
        `Lv.${S.level} • ${TANKS.find(t=>t.id===S.tank).name} +${S.upgrades[S.tank]}`;
    $("energy").textContent=`${S.energy}/200`;
    $("gold").textContent=money(S.gold);
    $("gems").textContent=money(S.gems);
    $("sound").textContent=S.sound?"🔊":"🔇";
}

function save(){
    try{
        localStorage.setItem(KEY,JSON.stringify(S));
    }catch(e){
        if(!storageWarned){
            storageWarned=true;
            toast("Trình duyệt chặn lưu: tiến trình chỉ giữ trong phiên này.",4);
        }
    }
    hud();
}

function regen(){
    const n=Math.floor((Date.now()-S.energyAt)/120000);
    if(n>0){
        S.energy=Math.min(200,S.energy+n);
        S.energyAt+=n*120000;
        save();
    }
}

function log(message,reward=false){
    const div=document.createElement("div");
    div.textContent=message;
    if(reward)div.className="reward";
    $("chatlog").appendChild(div);
    while($("chatlog").children.length>30)
        $("chatlog").firstChild.remove();
    $("chatlog").scrollTop=$("chatlog").scrollHeight;
}

function toast(message,seconds=2.7){
    $("toast").textContent=message;
    $("toast").style.opacity=1;
    toastEnd=performance.now()+seconds*1000;
}

function sound(kind="click"){
    if(!S.sound)return;
    const nowMs=performance.now();
    if(kind==="shot"&&nowMs-lastSound<90)return;
    if(kind==="shot")lastSound=nowMs;

    try{
        if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
        if(audio.state==="suspended")audio.resume();
        const o=audio.createOscillator(),g=audio.createGain();
        o.connect(g);g.connect(audio.destination);
        const presets={
            click:[620,410,.07,"sine",.05],
            shot:[160,55,.09,"triangle",.055],
            hit:[115,35,.13,"triangle",.075],
            boom:[90,20,.3,"sawtooth",.07],
            win:[420,940,.45,"sine",.08],
            heal:[380,790,.22,"sine",.06]
        };
        const p=presets[kind]||presets.click,n=audio.currentTime;
        o.type=p[3];
        o.frequency.setValueAtTime(p[0],n);
        o.frequency.exponentialRampToValueAtTime(p[1],n+p[2]);
        g.gain.setValueAtTime(p[4],n);
        g.gain.exponentialRampToValueAtTime(.001,n+p[2]);
        o.start(n);o.stop(n+p[2]+.02);
    }catch(e){}
}

function show(title,html,callback=null){
    modal=true;onClose=callback;
    $("title").textContent=title;
    $("content").innerHTML=html;
    $("content").scrollTop=0;

function close(run=true){

function poly(points,fill,stroke=null,line=2){
    ctx.beginPath();
    points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}
}

function oval(x,y,rx,ry,fill,stroke=null,line=2){
    ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}
}

function box(x,y,w,h,fill,r=0,stroke=null){
    ctx.beginPath();ctx.roundRect(x,y,w,h,r);
    ctx.fillStyle=fill;ctx.fill();
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}
}

function txt(s,x,y,size=20,fill="#fff",stroke="#365662",align="center"){
    ctx.font=`900 ${size}px Arial`;
    ctx.textAlign=align;ctx.textBaseline="middle";
    if(stroke){
        ctx.lineWidth=Math.max(3,size*.16);
        ctx.lineJoin="round";ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);
    }
    ctx.fillStyle=fill;ctx.fillText(s,x,y);
}

function cloud(x,y,s=1,a=.7){
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=a;
    oval(0,0,49,16,"#f3ffff");
    oval(-25,-8,24,20,"#f3ffff");
    oval(10,-16,29,24,"#f3ffff");
    oval(38,-4,26,18,"#f3ffff");
    ctx.restore();
}

function tree(x,y,s=1){
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    oval(3,3,27,10,"#234d4828");
    poly([[-6,1],[7,1],[8,-44],[-4,-48]],"#9d7751","#6b6747");
    oval(-18,-44,24,22,"#369b60","#4a8851");
    oval(19,-45,25,24,"#54b66a");
    oval(1,-62,30,26,"#65c76e","#4b9958");
    oval(-8,-71,20,13,"#9bdd7e");
    oval(22,-54,13,10,"#9bdc79");
    ctx.restore();
}

function lerpAngle(a,b,t){
    const d=Math.atan2(Math.sin(b-a),Math.cos(b-a));
    return a+d*Math.min(1,t);
}

             "#59868b","#9ed8d7",2);

             "#bfdbbe");

function doAction(action,id=""){
    if(action.startsWith("play-")){
        startBattle(action.slice(5));
        return;
    }

    switch(action){
        case "close":
            close();
            break;

        case "battle":
        case "duel":
            battleMenu();
            break;

        case "boss":
            bossMenu();
            break;

        case "tanks":
            tankMenu();
            break;

        case "shop":
            shopMenu();
            break;

        case "quests":
            questMenu();
            break;

        case "daily":
            dailyMenu();
            break;

        case "activity":
            activityMenu();
            break;

        case "records":
            recordsMenu();
            break;

        case "guild":
            guildMenu();
            break;

        case "profile":
            profileMenu();
            break;

        case "help":
            helpMenu();
            break;

        case "hub":
            returnLobby();
            break;

        case "leave":
            if(!B||B.finished)return;
            show("Rời Chiến Trường?",`
                <div class="card">
                    <h3>Trận hiện tại sẽ bị bỏ dở</h3>
                    <p>
                        Không nhận thưởng hoặc thành tích.
                        Năng lượng đã dùng không được hoàn lại.
                    </p>
                    <div class="row">
                        <button class="action red" data-a="hub">
                            Rời trận
                        </button>
                        <button class="action blue" data-a="close">
                            Tiếp tục
                        </button>
                    </div>
                </div>
            `);
            break;

        case "sound":
            S.sound=!S.sound;
            save();
            if(S.sound)sound();
            break;

        case "fullscreen":{
            const enter=$("stage").requestFullscreen
                ||$("stage").webkitRequestFullscreen;
            const exit=document.exitFullscreen
                ||document.webkitExitFullscreen;

            try{
                let result;
                if(document.fullscreenElement
                    ||document.webkitFullscreenElement){
                    if(exit)result=exit.call(document);
                }else{
                    if(enter)result=enter.call($("stage"));
                    else toast("Trình duyệt này không hỗ trợ toàn màn hình.");
                }

                if(result&&typeof result.catch==="function"){
                    result.catch(()=>toast("Không bật được toàn màn hình."));
                }
            }catch(e){
                toast("Không bật được toàn màn hình.");
            }
            break;
        }

        case "tank":{
            const t=TANKS.find(t=>t.id===id);
            if(!t)return;

            if(!S.owned.includes(id)){
                if(S.gold<t.cost){
                    toast("Chưa đủ vàng để mở khóa xe này.");
                    return;
                }
                S.gold-=t.cost;
                S.owned.push(id);
                log(`Đã mở khóa ${t.name}.`,true);
            }

            S.tank=id;
            save();
            tankMenu();
            toast(`Đã trang bị ${t.name}.`);
            break;
        }

        case "upgrade":{
            const id=S.tank;
            const level=S.upgrades[id];

            if(level>=5)return;

            const cost=230*(level+1);

            if(S.gold<cost){
                toast(`Cần ${money(cost)} vàng để nâng cấp.`);
                return;
            }

            S.gold-=cost;
            S.upgrades[id]++;
            S.stats.upgrades++;

            save();
            shopMenu();
            sound("win");

            toast(`Nâng cấp thành công! Xe +${S.upgrades[id]}.`);
            log(`Đã nâng cấp ${TANKS.find(t=>t.id===id).name}.`,true);
            break;
        }

        case "energybuy":
            if(S.energy>=200){
                toast("Năng lượng đã đầy.");
                return;
            }
            if(S.gems<5){
                toast("Cần 5 kim cương.");
                return;
            }

            S.gems-=5;
            S.energy=Math.min(200,S.energy+50);
            save();
            shopMenu();
            toast("Đã tiếp tế năng lượng.");
            break;

        case "claim":{
            const q=QUESTS.find(q=>q.id===id);
            if(!q||S.claimed.includes(id)
                ||S.stats[q.stat]<q.need)return;

            S.claimed.push(id);
            S.gold+=q.gold;
            S.gems+=q.gems;
            save();
            questMenu();
            sound("win");
            toast(`Nhận ${q.gold} vàng + ${q.gems} kim cương.`);
            log(`Hoàn thành nhiệm vụ: ${q.name}.`,true);
            break;
        }

        case "dailyclaim":
            if(S.daily===day())return;
            S.daily=day();
            S.gold+=200;
            S.gems+=3;
            S.energy=Math.min(200,S.energy+25);
            save();
            dailyMenu();
            sound("win");
            toast("Đã nhận quà đăng nhập.");
            log("Nhận tiếp tế ngày: 200 vàng, 3 kim cương, 25 năng lượng.",true);
            break;

        case "activityclaim":
            if(S.activity===day())return;
            if(S.energy>=200){
                toast("Năng lượng đang đầy. Bạn có thể nhận sau.");
                return;
            }
            S.activity=day();
            S.energy=Math.min(200,S.energy+30);
            save();
            activityMenu();
            toast("Đã nhận 30 năng lượng.");
            break;

        case "rename":{
            const field=$("rename");
            if(!field)return;
            const name=field.value.trim().slice(0,18);

            if(!name){
                toast("Vui lòng nhập tên nhân vật.");
                return;
            }

            S.name=name;
            save();
            profileMenu();
            toast("Đã đổi tên chỉ huy.");
            break;
        }

        case "resetask":
            show("⚠️ Xóa Tiến Trình",`
                <div class="card">
                    <h3>Thao tác không thể hoàn tác</h3>
                    <p>
                        Vàng, kim cương, xe, nâng cấp và thành tích
                        sẽ trở về ban đầu.
                    </p>
                    <div class="row">
                        <button class="action red" data-a="resetconfirm">
                            Xác nhận xóa
                        </button>
                        <button class="action blue" data-a="profile">
                            Giữ tiến trình
                        </button>
                    </div>
                </div>
            `);
            break;

        case "resetconfirm":
            S=initialSave();
            returnLobby();
            save();
            log("Đã tạo tiến trình mới.");
            toast("Đã đặt lại tiến trình.");
            break;

        case "aim":
            if(!B||B.finished)return;
            input.auto=!input.auto;
            toast(input.auto
                ?"Đã bật ngắm tự động."
                :"Ngắm tay: chạm chiến trường hoặc di chuyển chuột.");
            updateBattleUI();
            break;

        case "dash":
        case "shield":
        case "repair":
            useSkill(action);
            break;
    }
}

function obstacle(x,y,w,h,type="stone"){

        x,y,w,h,type,

        maxHP:type==="crate"?85:Infinity,

function buildMap(mode){
    const obstacles=[];
    const boss=mode==="boss";

    // Các khối đá tạo đường đi vòng, không kín hoàn toàn.
    const stoneLayout=boss?[
        [470,250,150,65],
        [470,815,150,65],
        [840,355,70,135],
        [840,700,70,130],
        [1380,230,155,65],
        [1380,850,155,65]
    ]:[
        [420,240,140,65],
        [420,845,140,65],
        [665,420,70,150],
        [665,710,70,145],
        [1015,285,70,145],
        [1015,580,70,145],
        [1250,240,140,65],
        [1250,845,140,65],
        [870,520,120,65]
    ];

    stoneLayout.forEach(r=>obstacles.push(obstacle(...r,"stone")));

    // Hồ nước: xe không đi qua, đạn có thể bay qua.
    const waterLayout=boss?[
        [690,140,180,100],
        [1040,900,190,105]
    ]:[
        [740,130,200,100],
        [820,925,200,100]
    ];

    waterLayout.forEach(r=>obstacles.push(obstacle(...r,"water")));

    const crates=[
        [335,420],[335,650],[540,530],[540,650],
        [750,305],[790,800],[990,380],[1120,780],
        [1190,525],[1380,420],[1380,650],[1500,530],
        [585,170],[1160,930],[900,740],[1090,190]
    ];

    crates.forEach(([x,y])=>{
        if(boss&&x>1150&&y>330&&y<760)return;
        obstacles.push(obstacle(x,y,43,43,"crate"));
    });

    return obstacles;
}

function buildGroundTexture(){
    const c=document.createElement("canvas");
    c.width=MW;c.height=MH;
    const g=c.getContext("2d");

    const bg=g.createLinearGradient(0,0,MW,MH);
    bg.addColorStop(0,"#83bf77");
    bg.addColorStop(.5,"#a8d98c");
    bg.addColorStop(1,"#76b875");
    g.fillStyle=bg;g.fillRect(0,0,MW,MH);

    // Đường lát.
    g.lineCap="round";

    const roads=[
        [[135,575],[1660,575]],
        [[330,190],[1420,970]],
        [[380,960],[1430,190]]
    ];

    for(const [a,b] of roads){
        g.beginPath();g.moveTo(...a);g.lineTo(...b);
        g.strokeStyle="#c6cc94";g.lineWidth=145;g.stroke();
        g.strokeStyle="#dad5a5";g.lineWidth=119;g.stroke();
    }

    // Đốm nền và cỏ.
    for(let i=0;i<900;i++){
        const x=rand(20,MW-20),y=rand(20,MH-20);
        g.globalAlpha=rand(.07,.19);
        g.fillStyle=i%2?"#f4f5bc":"#316e4c";
        g.beginPath();
        g.ellipse(x,y,rand(3,18),rand(2,10),0,0,Math.PI*2);
        g.fill();
    }

    g.globalAlpha=1;

    for(let i=0;i<360;i++){
        const x=rand(15,MW-15),y=rand(15,MH-15);
        g.strokeStyle=i%2?"#6ba666":"#8fb867";
        g.lineWidth=1.5;
        g.beginPath();
        g.moveTo(x,y);g.lineTo(x-3,y-5);
        g.moveTo(x,y);g.lineTo(x+3,y-7);
        g.stroke();
    }

    // Các vòng xuất phát.
    for(const [x,color] of [[180,"#5ba8c6"],[1620,"#d79578"]]){
        g.strokeStyle=color;
        g.lineWidth=4;
        g.beginPath();g.arc(x,575,100,0,Math.PI*2);g.stroke();

        g.globalAlpha=.15;
        g.fillStyle=color;g.fill();
        g.globalAlpha=1;
    }

    // Viền bản đồ.
    g.strokeStyle="#527d61";g.lineWidth=30;
    g.strokeRect(0,0,MW,MH);
    g.strokeStyle="#c9e6ad";g.lineWidth=5;
    g.strokeRect(17,17,MW-34,MH-34);

    return c;
}

function circleRect(x,y,r,o){
    const nx=clamp(x,o.x,o.x+o.w);
    const ny=clamp(y,o.y,o.y+o.h);
    return Math.hypot(x-nx,y-ny)<r;
}

function blocked(x,y,r=23){
    if(x<r+19||y<r+19||x>MW-r-19||y>MH-r-19)
        return true;

    return B.obstacles.some(o=>
        o.alive&&circleRect(x,y,r,o)
    );
}

function segmentRect(x1,y1,x2,y2,o,pad=0){
    let near=0,far=1;
    const dx=x2-x1,dy=y2-y1;

    for(const [origin,delta,min,max] of [
        [x1,dx,o.x-pad,o.x+o.w+pad],
        [y1,dy,o.y-pad,o.y+o.h+pad]
    ]){
        if(Math.abs(delta)<.000001){
            if(origin<min||origin>max)return null;
            continue;
        }

        let a=(min-origin)/delta;
        let b=(max-origin)/delta;

        if(a>b)[a,b]=[b,a];

        near=Math.max(near,a);
        far=Math.min(far,b);

        if(near>far)return null;
    }

    return near;
}

function segmentCircle(x1,y1,x2,y2,cx,cy,r){
    const dx=x2-x1,dy=y2-y1;
    const ox=x1-cx,oy=y1-cy;
    const a=dx*dx+dy*dy;
    const c=ox*ox+oy*oy-r*r;

    if(c<=0)return 0;
    if(a<.000001)return null;

    const b=2*(ox*dx+oy*dy);
    const discriminant=b*b-4*a*c;

    if(discriminant<0)return null;

    const t=(-b-Math.sqrt(discriminant))/(2*a);
    return t>=0&&t<=1?t:null;
}

function lineClear(a,b){
    return !B.obstacles.some(o=>
        o.alive&&o.type!=="water"
        &&segmentRect(a.x,a.y,b.x,b.y,o,3)!==null
    );
}

const CELL=75;
const NC=Math.ceil(MW/CELL);
const NR=Math.ceil(MH/CELL);

function rebuildNavigation(){
    B.nav=new Uint8Array(NC*NR);

    for(let row=0;row<NR;row++){
        for(let col=0;col<NC;col++){
            const x=col*CELL+CELL/2;
            const y=row*CELL+CELL/2;
            B.nav[row*NC+col]=blocked(x,y,26)?1:0;
        }
    }
}

function nearestFreeCell(x,y){
    const col=clamp(Math.floor(x/CELL),0,NC-1);
    const row=clamp(Math.floor(y/CELL),0,NR-1);
    const start=row*NC+col;

    if(!B.nav[start])return start;

    let best=-1,score=Infinity;

    for(let r=Math.max(0,row-3);r<=Math.min(NR-1,row+3);r++){
        for(let c=Math.max(0,col-3);c<=Math.min(NC-1,col+3);c++){
            const index=r*NC+c;
            if(B.nav[index])continue;

            const d=(c-col)*(c-col)+(r-row)*(r-row);
            if(d<score){score=d;best=index}
        }
    }

    return best;
}

function findPath(start,target){
    const from=nearestFreeCell(start.x,start.y);
    const to=nearestFreeCell(target.x,target.y);

    if(from<0||to<0||from===to)return [];

    const parent=new Int32Array(NC*NR);
    parent.fill(-1);

    const queue=[from];
    parent[from]=from;

    for(let head=0;head<queue.length;head++){
        const current=queue[head];
        if(current===to)break;

        const c=current%NC;
        const r=Math.floor(current/NC);

        for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
            const cc=c+dc,rr=r+dr;

            if(cc<0||rr<0||cc>=NC||rr>=NR)continue;

            const next=rr*NC+cc;
            if(B.nav[next]||parent[next]!==-1)continue;

            parent[next]=current;
            queue.push(next);
        }
    }

    if(parent[to]===-1)return [];

    const result=[];
    let current=to;

    while(current!==from){
        result.push({
            x:(current%NC)*CELL+CELL/2,
            y:Math.floor(current/NC)*CELL+CELL/2
        });
        current=parent[current];
    }

    result.reverse();
    return result;
}

function moveTank(t,dx,dy,dt){
    const length=Math.hypot(dx,dy);
    if(length<.001){t.vx=0;t.vy=0;return}

    dx/=Math.max(1,length);
    dy/=Math.max(1,length);

    const speed=t.speed*(t.dashTime>0?1.75:1);
    const oldX=t.x,oldY=t.y;

    const newX=clamp(t.x+dx*speed*dt,t.r+20,MW-t.r-20);
    const newY=clamp(t.y+dy*speed*dt,t.r+20,MH-t.r-20);

    if(!blocked(newX,t.y,t.r))t.x=newX;
    if(!blocked(t.x,newY,t.r))t.y=newY;

    t.vx=(t.x-oldX)/dt;
    t.vy=(t.y-oldY)/dt;

    const moved=Math.hypot(t.x-oldX,t.y-oldY);

    if(moved>.01){
        t.body=lerpAngle(t.body,Math.atan2(dy,dx),dt*10);
        t.track+=moved;
    }

    return moved;
}

function makeTank(def,team,x,y,name,player=false,boss=false){
    const upgrade=player?S.upgrades[def.id]:0;
    const levelBonus=player?Math.min(S.level-1,15)*4:0;

    let hp=def.hp+upgrade*10+levelBonus;
    let damage=def.damage+upgrade*3;

    if(!player&&team===1&&B.mode==="hard"){
        hp=Math.round(hp*1.18);
        damage=Math.round(damage*1.14);
    }

    return{
        id:nextTankID++,
        definition:def.id,
        name,team,player,boss,
        x,y,spawnX:x,spawnY:y,
        r:boss?43:23,
        hp,maxHP:hp,
        color:def.color,
        speed:def.speed,
        damage,
        rate:def.rate,
        bulletSpeed:def.bulletSpeed,
        blast:def.blast,
        pellets:def.pellets||1,
        alive:true,respawn:0,
        vx:0,vy:0,
        body:team===0?0:Math.PI,
        turret:team===0?0:Math.PI,
        track:0,shotCD:rand(0,.3),
        hurt:0,spawnShield:1.5,
        dashTime:0,dashCD:0,
        shieldTime:0,shieldCD:0,
        repairCD:0,repairCharges:2,
        powerTime:0,
        path:[],pathCD:rand(0,.4),
        target:null,
        strafe:Math.random()>.5?1:-1,
        stuck:0,
        burstCD:boss?5.5:0
    };
}

        mode==="boss"
            ?"Boss xuất hiện! Bạn có 3 mạng. Giữ BẮN và dùng kỹ năng để sinh tồn."

    );

function canControl(){
    return scene==="battle"&&B&&!B.finished&&!modal
        &&B.player.alive;
}

function useSkill(skill){
    if(!canControl())return;

    const p=B.player;

    if(skill==="dash"){
        if(p.dashCD>0)return;

        p.dashTime=2.4;
        p.dashCD=12;
        toast("Tăng tốc đã kích hoạt!",1.4);
    }

    if(skill==="shield"){
        if(p.shieldCD>0)return;

        p.shieldTime=4;
        p.shieldCD=18;
        toast("Lá chắn giảm 65% sát thương.",1.6);
    }

    if(skill==="repair"){
        if(p.repairCD>0||p.repairCharges<=0)return;

        if(p.hp>=p.maxHP){
            toast("Xe đang đầy máu.");
            return;
        }

        const heal=Math.min(45,p.maxHP-p.hp);
        p.hp+=heal;
        p.repairCharges--;
        p.repairCD=25;

        floatText(p.x,p.y-44,`+${heal} HP`,"#c5ffb7");
        particles(p.x,p.y,"#a1f3ad",20);
        sound("heal");
    }

    updateBattleUI();
}

/* =================== AI =================== */

function nearestEnemy(t,preferVisible=false){
    let best=null,bestScore=Infinity;

    for(const other of B.tanks){
        if(!other.alive||other.team===t.team)continue;

        let score=distance(t,other);

        if(preferVisible&&!lineClear(t,other))score+=440;

        if(score<bestScore){
            best=other;
            bestScore=score;
        }
    }

    return best;
}

function aimTank(t,target,dt,accuracy=1){
    const dist=distance(t,target);
    const travel=Math.min(.65,dist/t.bulletSpeed);

    const tx=target.x+target.vx*travel*accuracy;
    const ty=target.y+target.vy*travel*accuracy;

    const angle=Math.atan2(ty-t.y,tx-t.x);

    t.turret=lerpAngle(t.turret,angle,dt*(t.boss?4:12));

    return Math.abs(Math.atan2(
        Math.sin(angle-t.turret),
        Math.cos(angle-t.turret)
    ));
}

function updateBot(t,dt){
    if(!t.alive)return;

    let target=t.target;

    if(!target||!target.alive||target.team===t.team){
        target=nearestEnemy(t);
        t.target=target;
    }

    // Thỉnh thoảng chọn lại để phản ứng với đối thủ đang áp sát.
    t.pathCD-=dt;

    if(t.pathCD<=0){
        target=nearestEnemy(t,true);
        t.target=target;
        t.pathCD=.7+rand(0,.25);

        if(target&&!lineClear(t,target)){
            t.path=findPath(t,target);
        }else{
            t.path=[];
        }
    }

    if(!target)return;

    const d=distance(t,target);
    const visible=lineClear(t,target);

    let mx=0,my=0;

    if(!visible&&t.path.length){
        const waypoint=t.path[0];

        if(Math.hypot(waypoint.x-t.x,waypoint.y-t.y)<23){
            t.path.shift();
        }

        if(t.path.length){
            mx=t.path[0].x-t.x;
            my=t.path[0].y-t.y;
        }
    }else{
        const dx=(target.x-t.x)/Math.max(1,d);
        const dy=(target.y-t.y)/Math.max(1,d);

        if(t.boss){
            if(d>360){mx=dx;my=dy}
            else if(d<180){mx=-dx;my=-dy}
        }else if(d>370){
            mx=dx;my=dy;
        }else if(d<180){
            mx=-dx;my=-dy;
        }else{
            // Di chuyển ngang để tránh đạn.
            mx=-dy*t.strafe*.7;
            my=dx*t.strafe*.7;
        }
    }

    // Tách xe khỏi đồng đội đứng quá gần.
    for(const other of B.tanks){
        if(other===t||!other.alive)continue;

        const gap=distance(t,other);

        if(gap<70&&gap>1){
            mx+=(t.x-other.x)/gap*.7;
            my+=(t.y-other.y)/gap*.7;
        }
    }

    const moved=moveTank(t,mx,my,dt)||0;

    if(Math.hypot(mx,my)>.1&&moved<.15){
        t.stuck+=dt;

        if(t.stuck>.35){
            t.strafe*=-1;

            // Thử lách vuông góc khi góc tường chặn xe.
            moveTank(t,-my*t.strafe,mx*t.strafe,dt);
        }

        if(t.stuck>1.2){
            t.path=findPath(t,target);
            t.pathCD=.8;
            t.stuck=0;
        }
    }else{
        t.stuck=Math.max(0,t.stuck-dt*2);
    }

    const precision=B.mode==="hard"?1:
        B.mode==="training"?.2:.65;

    const aimError=aimTank(t,target,dt,precision);

    if(
        visible&&d<660&&aimError<(t.boss?.35:.18)
        &&t.shotCD<=0
    ){
        const spread=B.mode==="training"?.16:
            B.mode==="hard"?.025:.065;

        shoot(t,t.turret+rand(-spread,spread));
    }

    if(t.boss){
        t.burstCD-=dt;

        if(t.burstCD<=0){
            t.burstCD=6.7;

            for(let i=0;i<10;i++){
                createBullet(
                    t,
                    i*Math.PI*2/10+time*.15,
                    .72,
                    0
                );
            }

            particles(t.x,t.y,"#ffc988",34);
            floatText(t.x,t.y-78,"ĐẠN TỎA TRÒN!","#ffe49b");
            sound("boom");
        }
    }
}

/* =================== ĐẠN VÀ SÁT THƯƠNG =================== */

function createBullet(t,angle,multiplier=1,spread=0){
    const a=angle+spread;
    const muzzle=t.r+(t.boss?25:19);

    B.bullets.push({
        x:t.x+Math.cos(a)*muzzle,
        y:t.y+Math.sin(a)*muzzle,
        vx:Math.cos(a)*t.bulletSpeed,
        vy:Math.sin(a)*t.bulletSpeed,
        team:t.team,owner:t.id,
        damage:t.damage*multiplier*(t.powerTime>0?1.3:1),
        blast:t.blast,
        life:t.boss?3.2:2.4,
        color:t.definition==="plasma"
            ?"#b7b0ff"
            :t.team===0?"#fff1a1":"#ffc197",
        r:t.boss?6:t.definition==="plasma"?5:4,
        alive:true
    });
}

function shoot(t,angle=t.turret){
    if(!t.alive||t.shotCD>0||B.finished)return;

    t.shotCD=t.rate;

    if(t.pellets>1){
        for(let i=0;i<t.pellets;i++){
            const spread=(i-(t.pellets-1)/2)*.18;
            createBullet(t,angle,1,spread);
        }
    }else{
        createBullet(t,angle);
    }

    const muzzle=t.r+15;
    particles(
        t.x+Math.cos(angle)*muzzle,
        t.y+Math.sin(angle)*muzzle,
        "#ffe4a0",
        4,
        65
    );

    if(t.player)sound("shot");
}

function floatText(x,y,text,color="#fff0a1"){
    if(!B)return;
    B.labels.push({x,y,text:String(text),color,life:1.15});
}

function particles(x,y,color,count=18,speed=160){
    if(!B)return;

    for(let i=0;i<count;i++){
        const a=rand(0,Math.PI*2);
        const v=rand(speed*.2,speed);

        B.particles.push({
            x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
            life:rand(.2,.75),size:rand(2,6),color
        });
    }

    if(B.particles.length>450){
        B.particles.splice(0,B.particles.length-450);
    }
}

function ownerTank(id){
    return B.tanks.find(t=>t.id===id)||null;
}

function damageTank(t,amount,ownerID){
    if(!t.alive||t.spawnShield>0)return 0;

    if(t.shieldTime>0)amount*=.35;

    const actual=Math.min(
        t.hp,
        Math.max(1,Math.round(amount))
    );

    t.hp-=actual;
    t.hurt=.14;

    const owner=ownerTank(ownerID);

    if(owner&&owner.player){
        B.damage+=actual;
    }

    floatText(t.x,t.y-t.r-18,`-${actual}`,
        t.team===0?"#ffc5a5":"#fff0a7");

    if(t.hp<=0){
        killTank(t,owner);
    }else if(t.player){
        B.shake=Math.max(B.shake,3);
        sound("hit");
    }

    return actual;
}

function killTank(t,owner){
    if(!t.alive)return;

    t.hp=0;
    t.alive=false;
    t.vx=0;t.vy=0;
    t.respawn=t.boss?Infinity:B.mode==="boss"?5:4;

    particles(t.x,t.y,"#f3c179",40,230);
    particles(t.x,t.y,"#879195",22,150);

    B.rings.push({
        x:t.x,y:t.y,r:t.boss?115:55,
        life:.6,max:.6,color:"#ffc16e"
    });

    if(owner&&owner.team!==t.team){
        B.score[owner.team]++;

        if(owner.player){
            B.kills++;
            floatText(t.x,t.y-62,"HẠ XE!","#fff5ac");
        }
    }

    if(t.player){
        clearInput();

        if(B.mode==="boss"){
            B.lives--;
            toast(B.lives>0
                ?`Xe bị hạ! Còn ${B.lives} mạng.`
                :"Bạn đã dùng hết 3 mạng.",2.5);
        }else{
            toast("Xe bị hạ! Hồi sinh sau 4 giây.",2);
        }

        sound("boom");
    }

    if(!t.boss&&Math.random()<.45){
        dropPickup(t.x,t.y);
    }
}

function damageObstacle(o,damage){
    if(!o.alive||o.type!=="crate")return;

    o.hp-=damage;

    if(o.hp<=0){
        o.alive=false;
        const x=o.x+o.w/2,y=o.y+o.h/2;

        particles(x,y,"#cfa06e",22,150);

        if(Math.random()<.4)dropPickup(x,y);

        rebuildNavigation();
    }
}

function impactBullet(b,x,y,target=null,ob=null){
    b.alive=false;

    if(b.blast>0){
        B.rings.push({
            x,y,r:b.blast,life:.38,max:.38,color:"#ffc28a"
        });

        particles(x,y,"#ffd18e",22,185);

        for(const t of B.tanks){
            if(!t.alive||t.team===b.team)continue;

            const d=Math.max(0,Math.hypot(t.x-x,t.y-y)-t.r);

            if(t===target||d<b.blast){
                const multiplier=t===target
                    ?1
                    :clamp(1-d/b.blast,.1,1);

                damageTank(t,b.damage*multiplier,b.owner);
            }
        }

        for(const obstacle of B.obstacles){
            if(!obstacle.alive||obstacle.type!=="crate")continue;

            const nx=clamp(x,obstacle.x,obstacle.x+obstacle.w);
            const ny=clamp(y,obstacle.y,obstacle.y+obstacle.h);

            if(Math.hypot(x-nx,y-ny)<b.blast){
                damageObstacle(obstacle,b.damage);
            }
        }

        const p=B.player;

        if(p.alive&&Math.hypot(p.x-x,p.y-y)<300){
            B.shake=Math.max(B.shake,5);
        }
    }else{
        particles(x,y,b.color,7,100);

        if(target)damageTank(target,b.damage,b.owner);
        if(ob)damageObstacle(ob,b.damage);
    }
}

function updateBullets(dt){
    for(const b of B.bullets){
        if(!b.alive)continue;

        b.life-=dt;

        if(b.life<=0){
            b.alive=false;
            continue;
        }

        const x1=b.x,y1=b.y;
        const x2=x1+b.vx*dt,y2=y1+b.vy*dt;

        let best=1.01;
        let hitTank=null,hitObstacle=null;

        for(const o of B.obstacles){
            if(!o.alive||o.type==="water")continue;

            const fraction=segmentRect(x1,y1,x2,y2,o,b.r);

            if(fraction!==null&&fraction<best){
                best=fraction;
                hitObstacle=o;
                hitTank=null;
            }
        }

        for(const t of B.tanks){
            if(!t.alive||t.team===b.team)continue;

            const fraction=segmentCircle(
                x1,y1,x2,y2,t.x,t.y,t.r+b.r
            );

            if(fraction!==null&&fraction<best){
                best=fraction;
                hitTank=t;
                hitObstacle=null;
            }
        }

        if(best<=1){
            b.x=x1+(x2-x1)*best;
            b.y=y1+(y2-y1)*best;
            impactBullet(b,b.x,b.y,hitTank,hitObstacle);
        }else{
            b.x=x2;b.y=y2;

            if(b.x<16||b.y<16||b.x>MW-16||b.y>MH-16){
                b.alive=false;
                particles(
                    clamp(b.x,16,MW-16),
                    clamp(b.y,16,MH-16),
                    b.color,5,80
                );
            }
        }
    }

    B.bullets=B.bullets.filter(b=>b.alive);
}

/* =================== TIẾP TẾ VÀ HỒI SINH =================== */

function dropPickup(x,y,type=null){
    if(!B||B.pickups.length>=9)return;

    if(blocked(x,y,12))return;

    const types=["heal","power","shield"];

    B.pickups.push({
        x,y,
        type:type||types[Math.floor(rand(0,types.length))],
        life:28,bob:rand(0,6)
    });
}

function randomPickup(){
    for(let i=0;i<20;i++){
        const x=rand(300,MW-300),y=rand(140,MH-140);

        if(!blocked(x,y,24)){
            dropPickup(x,y);
            break;
        }
    }
}

function updatePickups(dt){
    B.pickupClock-=dt;

    if(B.pickupClock<=0){
        B.pickupClock=8;
        randomPickup();
    }

    for(const item of B.pickups){
        item.life-=dt;

        if(item.life<=0)continue;

        for(const t of B.tanks){
            if(!t.alive||t.boss||distance(t,item)>t.r+17)continue;

            if(item.type==="heal"){
                if(t.hp>=t.maxHP)continue;

                const healed=Math.min(38,t.maxHP-t.hp);
                t.hp+=healed;
                floatText(t.x,t.y-40,`+${healed} HP`,"#c4ffab");
            }

            if(item.type==="power"){
                t.powerTime=8;
                floatText(t.x,t.y-40,"HỎA LỰC +30%","#ffe392");
            }

            if(item.type==="shield"){
                t.shieldTime=Math.max(t.shieldTime,4.5);
                floatText(t.x,t.y-40,"LÁ CHẮN","#a8efff");
            }

            item.life=0;

            particles(t.x,t.y,"#c7fff2",15,110);
            if(t.player)sound("heal");
            break;
        }
    }

    B.pickups=B.pickups.filter(p=>p.life>0);
}

function respawnTank(t){
    let spawn={x:t.spawnX,y:t.spawnY};

    for(let i=0;i<16;i++){
        const candidate={
            x:clamp(t.spawnX+rand(-75,75),70,MW-70),
            y:clamp(t.spawnY+rand(-95,95),70,MH-70)
        };

        if(!blocked(candidate.x,candidate.y,t.r)){
            spawn=candidate;
            break;
        }
    }

    t.x=spawn.x;t.y=spawn.y;
    t.hp=t.maxHP;
    t.alive=true;
    t.spawnShield=2;
    t.shotCD=.4;
    t.shieldTime=0;
    t.dashTime=0;
    t.powerTime=0;
    t.path=[];
    t.target=null;
    t.vx=0;t.vy=0;
    t.body=t.team===0?0:Math.PI;
    t.turret=t.body;

    particles(t.x,t.y,"#baf3f4",25,100);

    if(t.player)toast("Đã hồi sinh! Lá chắn xuất phát trong 2 giây.",2);
}

function updateTankTimers(t,dt){
    for(const key of [
        "shotCD","hurt","spawnShield",
        "dashTime","dashCD","shieldTime","shieldCD",
        "repairCD","powerTime"
    ]){
        t[key]=Math.max(0,t[key]-dt);
    }

    if(!t.alive&&!t.boss){
        if(t.player&&B.mode==="boss"&&B.lives<=0)return;

        t.respawn-=dt;

        if(t.respawn<=0)respawnTank(t);
    }
}

/* =================== KẾT QUẢ VÀ TIẾN TRÌNH =================== */

function addXP(amount){
    S.xp+=amount;
    let gained=0;

    while(S.level<999&&S.xp>=S.level*100){
        S.xp-=S.level*100;
        S.level++;
        gained++;
    }

    return gained;
}

function checkEnd(){
    if(!B||B.finished)return;

    if(B.mode==="boss"){
        const boss=B.tanks.find(t=>t.boss);

        if(!boss.alive){
            finish("win","Boss Cự Pháo đã bị phá hủy!");
            return;
        }

        if(B.lives<=0){
            finish("lose","Bạn đã dùng hết 3 mạng.");
            return;
        }

        if(B.timer<=0){
            finish("lose","Hết thời gian đánh Boss.");
        }

        return;
    }

    if(B.score[0]>=B.goal||B.score[1]>=B.goal||B.timer<=0){
        const result=B.score[0]===B.score[1]
            ?"draw"
            :B.score[0]>B.score[1]?"win":"lose";

        finish(result,B.timer<=0
            ?"Đã hết thời gian trận đấu."
            :"Một đội đã đạt mục tiêu điểm.");
    }
}

function finish(result,reason){
    if(!B||B.finished)return;

    B.finished=true;
    clearInput();

    const training=B.mode==="training";
    const won=result==="win";
    const draw=result==="draw";

    let gold=0,gems=0,xp=0;

    if(!training){
        S.stats.played++;
        S.stats.kills+=B.kills;
        S.stats.damage+=Math.floor(B.damage);
        S.stats.best=Math.max(S.stats.best,B.kills);

        if(won){
            S.stats.wins++;

            if(B.mode==="boss"){
                gold=400;gems=8;xp=150;
                S.stats.boss++;
            }else if(B.mode==="hard"){
                gold=280;xp=110;
            }else{
                gold=180;xp=75;
            }
        }else if(draw){
            gold=80;xp=30;
        }else{
            gold=45;xp=20;
        }

        S.gold+=gold;
        S.gems+=gems;
    }

    const gained=training?0:addXP(xp);
    const mode=B.mode;

    save();

    const heading=won?"🏆 CHIẾN THẮNG":
        draw?"🤝 TRẬN HÒA":"💪 THỬ LẠI NHÉ";

    log(`${heading.replace(/^[^\s]+\s/,"")} • ${
        training?"Luyện tập":
        `+${gold} vàng, +${xp} XP`
    }.`,true);

    if(won){
        sound("win");

        particles(
            B.player.x,B.player.y,
            "#ffe397",100,260
        );
    }

    show("Kết Quả Chiến Trường",`
        <h2 style="
            text-align:center;font-size:38px;
            color:${won?"#b18329":"#587984"};margin:5px 0 13px">
            ${heading}
        </h2>

        <p style="text-align:center">${reason}</p>

        <div class="grid">
            <div class="card">
                <h3>Xe tự hạ</h3>
                <div class="stat">${B.kills}</div>
            </div>
            <div class="card">
                <h3>Sát thương gây ra</h3>
                <div class="stat">${money(B.damage)}</div>
            </div>
            <div class="card">
                <h3>Điểm hai đội</h3>
                <div class="stat">${B.score[0]} : ${B.score[1]}</div>
            </div>
        </div>

        <div class="note" style="margin-top:17px;text-align:center">
            ${training
                ?"Luyện tập không thưởng vàng, XP hoặc tính nhiệm vụ."
                :`Phần thưởng: <b>${gold} vàng + ${gems} 💎 + ${xp} XP</b>.`}
            ${gained>0?`<br>✨ Bạn đã lên cấp ${S.level}!`:""}
        </div>

        <div class="row" style="justify-content:center">
            <button class="action" data-a="play-${mode}">
                Chơi lại ${training?"• miễn phí":"• 8 ⚡"}
            </button>
            <button class="action blue" data-a="hub">
                Về đảo
            </button>
        </div>
    `,returnLobby);

    updateBattleUI();
}

/* =================== ĐIỀU KHIỂN CẢM ỨNG =================== */

function screenPoint(event){
    const bounds=canvas.getBoundingClientRect();

    return{
        x:(event.clientX-bounds.left)*W/bounds.width,
        y:(event.clientY-bounds.top)*H/bounds.height
    };
}

function nodeAt(p){
    let best=null,score=Infinity;

    for(const n of NODES){
        const centerY=n.y-55;
        const radiusX=n.type==="dome"?111:90;
        const radiusY=n.type==="carousel"?127:110;

        const d=Math.pow((p.x-n.x)/radiusX,2)
            +Math.pow((p.y-centerY)/radiusY,2);

        if(d<1&&d<score){best=n;score=d}
    }

    return best;
}

function setManualAim(point){
    if(!B||B.finished)return;

    input.auto=false;
    input.screenX=point.x;
    input.screenY=point.y;
    input.hasScreenAim=true;
    input.aimX=point.x+B.camera.x;
    input.aimY=point.y+B.camera.y;
}

canvas.addEventListener("pointerdown",event=>{
    if(modal||event.button!==0||canvasPointer!==null)return;

    const p=screenPoint(event);

    canvasPointer={
        id:event.pointerId,
        x:p.x,y:p.y,
        moved:false,
        scene
    };

    canvas.setPointerCapture(event.pointerId);
    event.preventDefault();

    if(scene==="battle"&&!B.finished){
        setManualAim(p);

        // Chuột trái vừa ngắm vừa bắn.
        // Cảm ứng bắn bằng nút riêng để tránh chạm nhầm.
        if(event.pointerType==="mouse"){
            input.mouseFire=true;
            sound("click");
        }
    }
});

canvas.addEventListener("pointermove",event=>{
    const p=screenPoint(event);

    if(scene==="lobby"&&!modal){
        const n=nodeAt(p);
        hover=n?n.id:null;
        canvas.style.cursor=n?"pointer":"default";
    }else if(scene==="battle"&&!modal&&B&&!B.finished){
        canvas.style.cursor="crosshair";

        if(!input.auto||canvasPointer){
            input.screenX=p.x;
            input.screenY=p.y;
            input.hasScreenAim=true;
            input.aimX=p.x+B.camera.x;
            input.aimY=p.y+B.camera.y;
        }
    }

    if(canvasPointer&&canvasPointer.id===event.pointerId){
        if(Math.hypot(p.x-canvasPointer.x,p.y-canvasPointer.y)>10){
            canvasPointer.moved=true;
        }
    }
});

canvas.addEventListener("pointerup",event=>{
    if(!canvasPointer||canvasPointer.id!==event.pointerId)return;

    const gesture=canvasPointer;
    const p=screenPoint(event);

    canvasPointer=null;
    input.mouseFire=false;

    if(canvas.hasPointerCapture(event.pointerId))
        canvas.releasePointerCapture(event.pointerId);

    if(
        scene==="lobby"&&gesture.scene===scene
        &&!gesture.moved&&!modal
    ){
        const n=nodeAt(p);

        if(n){
            sound();
            doAction(n.id);
        }
    }
});

function cancelCanvas(){
    canvasPointer=null;
    input.mouseFire=false;
}

canvas.addEventListener("pointercancel",cancelCanvas);
canvas.addEventListener("lostpointercapture",cancelCanvas);

canvas.addEventListener("pointerleave",()=>{
    hover=null;
});

// Joystick hỗ trợ giữ một ngón tay, đồng thời ngón khác giữ BẮN.
function updateJoystick(event){
    const r=$("joystick").getBoundingClientRect();
    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let x=(event.clientX-cx)/(r.width*.34);
    let y=(event.clientY-cy)/(r.height*.34);

    const magnitude=Math.hypot(x,y);

    if(magnitude>1){
        x/=magnitude;y/=magnitude;
    }

    if(magnitude<.1){
        x=0;y=0;
    }

    input.x=x;input.y=y;

    $("stick").style.transform=
        `translate(${x*35}px,${y*35}px)`;
}

$("joystick").addEventListener("pointerdown",event=>{
    if(!canControl()||stickPointer!==null)return;

    event.preventDefault();
    stickPointer=event.pointerId;
    $("joystick").setPointerCapture(event.pointerId);
    updateJoystick(event);
});

$("joystick").addEventListener("pointermove",event=>{
    if(stickPointer===event.pointerId){
        event.preventDefault();
        updateJoystick(event);
    }
});

function releaseJoystick(event){
    if(event&&stickPointer!==event.pointerId)return;

    stickPointer=null;
    input.x=0;input.y=0;
    $("stick").style.transform="";
}

$("joystick").addEventListener("pointerup",releaseJoystick);
$("joystick").addEventListener("pointercancel",releaseJoystick);
$("joystick").addEventListener("lostpointercapture",releaseJoystick);

let firePointer=null;

$("fire").addEventListener("pointerdown",event=>{
    if(!canControl()||firePointer!==null)return;

    event.preventDefault();
    firePointer=event.pointerId;
    $("fire").setPointerCapture(event.pointerId);
    input.fire=true;
    sound("click");
});

function releaseFire(event){
    if(event&&firePointer!==event.pointerId)return;
    firePointer=null;
    input.fire=false;
}

$("fire").addEventListener("pointerup",releaseFire);
$("fire").addEventListener("pointercancel",releaseFire);
$("fire").addEventListener("lostpointercapture",releaseFire);

addEventListener("keydown",event=>{
    if(event.key==="Escape"){
        if(modal)close();
        return;
    }

    if(
        event.target instanceof HTMLElement
        &&["INPUT","TEXTAREA","SELECT"].includes(event.target.tagName)
    )return;

    if(scene!=="battle"||modal)return;

    const k=event.key.toLowerCase();

    if([
        "w","a","s","d","arrowleft","arrowright",
        "arrowup","arrowdown"," ","1","2","3","t"
    ].includes(k)){
        event.preventDefault();
    }

    keys[k]=true;

    if(!event.repeat){
        if(k==="1")useSkill("dash");
        if(k==="2")useSkill("shield");
        if(k==="3")useSkill("repair");
        if(k==="t")doAction("aim");
    }
});

addEventListener("keyup",event=>{
    delete keys[event.key.toLowerCase()];
});

addEventListener("blur",()=>{
    clearInput();
    firePointer=null;
});

document.addEventListener("visibilitychange",()=>{
    clearInput();
    firePointer=null;
});

/* =================== GIAO DIỆN TRẬN ĐẤU =================== */

function formatTime(seconds){
    const n=Math.max(0,Math.ceil(seconds));
    return `${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`;
}

function updateBattleUI(){
    if(!B)return;

    const p=B.player;
    const enabled=canControl();

    $("modeLabel").textContent=B.mode==="boss"
        ?"🤖 BOSS CỰ PHÁO":
        B.mode==="hard"?"🏆 CAO THỦ":
        B.mode==="training"?"🎯 LUYỆN TẬP":"⚔️ ĐẤU ĐỘI 3v3";

    $("matchScore").textContent=B.mode==="boss"
        ?`♥ ${B.lives} mạng • ⏱ ${formatTime(B.timer)}`
        :`🔵 ${B.score[0]} : ${B.score[1]} 🔴 • ⏱ ${formatTime(B.timer)}`;

    $("hpText").textContent=p.alive
        ?`${TANKS.find(t=>t.id===p.definition).name} • ${Math.ceil(p.hp)}/${p.maxHP} HP`
        :`Hồi sinh sau ${Math.max(0,Math.ceil(p.respawn))} giây`;

    $("hpFill").style.width=
        `${clamp(p.hp/p.maxHP*100,0,100)}%`;

    const buffs=[];
    if(p.shieldTime>0)buffs.push(`🛡 ${p.shieldTime.toFixed(1)}s`);
    if(p.powerTime>0)buffs.push(`💥 ${p.powerTime.toFixed(1)}s`);
    if(p.dashTime>0)buffs.push(`💨 ${p.dashTime.toFixed(1)}s`);
    if(p.spawnShield>0)buffs.push("Bảo vệ hồi sinh");

    $("statusText").textContent=
        `Hạ xe: ${B.kills} • Sát thương: ${money(B.damage)}`
        +(buffs.length?" • "+buffs.join(" / "):"");

    $("aimButton").textContent=input.auto
        ?"🎯 Ngắm tự động"
        :"◎ Ngắm tay";

    $("aimButton").style.background=input.auto
        ?"#28765ae8":"#24516de8";

    $("fire").disabled=!enabled;

    $("dash").disabled=!enabled||p.dashCD>0;
    $("shield").disabled=!enabled||p.shieldCD>0;
    $("repair").disabled=!enabled||p.repairCD>0
        ||p.repairCharges<=0||p.hp>=p.maxHP;

    $("dash").textContent=p.dashCD>0
        ?`💨 ${Math.ceil(p.dashCD)}s`:"💨 Tăng tốc";

    $("shield").textContent=p.shieldCD>0
        ?`🛡 ${Math.ceil(p.shieldCD)}s`:"🛡 Lá chắn";

    $("repair").textContent=p.repairCD>0
        ?`🔧 ${Math.ceil(p.repairCD)}s`
        :`🔧 Sửa chữa (${p.repairCharges})`;
}

/* =================== ĐỒ HỌA CHIẾN TRƯỜNG =================== */

function visibleWorld(x,y,pad=100){
    return x>B.camera.x-pad&&y>B.camera.y-pad
        &&x<B.camera.x+W+pad&&y<B.camera.y+H+pad;
}

function drawObstacle(o){
    if(!o.alive)return;

    const x=o.x,y=o.y,w=o.w,h=o.h;

    if(!visibleWorld(x+w/2,y+h/2,180))return;

    if(o.type==="water"){
        oval(x+w/2,y+h/2,w/2+7,h/2+8,"#c9e1a5");
        box(x,y,w,h,"#479fae",23,"#bad8aa");
        box(x+7,y+7,w-14,h-14,"#69c9cf",20);

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x+7,y+7,w-14,h-14,20);
        ctx.clip();

        ctx.strokeStyle="#c6fff085";ctx.lineWidth=2;

        for(let i=0;i<5;i++){
            const yy=y+18+i*19;
            const offset=Math.sin(time*2+i)*7;

            ctx.beginPath();
            ctx.moveTo(x+12+offset,yy);
            ctx.quadraticCurveTo(x+w/2,yy-5,x+w-17+offset,yy);
            ctx.stroke();
        }

        ctx.restore();

        oval(x+w-20,y+12,10,5,"#66a565");
        oval(x+18,y+h-9,8,4,"#7db266");
        return;
    }

    box(x+5,y+8,w,h,"#31554438",8);

    if(o.type==="stone"){
        box(x,y,w,h,"#829b88",8,"#4c715e");
        box(x+4,y+3,w-8,h-9,"#bfccb0",7,"#d8e2bd");

        ctx.strokeStyle="#899b83";ctx.lineWidth=2;

        const vertical=w>h;

        if(vertical){
            for(let xx=x+35;xx<x+w;xx+=40){
                ctx.beginPath();
                ctx.moveTo(xx,y+4);ctx.lineTo(xx,y+h-7);
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.moveTo(x+4,y+h/2);
            ctx.lineTo(x+w-4,y+h/2);
            ctx.stroke();
        }else{
            for(let yy=y+34;yy<y+h;yy+=40){
                ctx.beginPath();
                ctx.moveTo(x+4,yy);ctx.lineTo(x+w-4,yy);
                ctx.stroke();
            }

            ctx
            .beginPath();
            ctx.moveTo(x+w/2,y+4);
            ctx.lineTo(x+w/2,y+h-7);
            ctx.stroke();
        }

        // Rêu và điểm sáng trên đá.
        box(x+8,y+6,Math.min(w-16,25),5,"#dbe8c0",2);
        oval(x+w-12,y+h-10,9,5,"#7faa78");
        return;
    }

    if(o.type==="crate"){
        box(x,y,w,h,"#bd8c50",5,"#725b3b");
        box(x+4,y+4,w-8,h-8,"#d1a66a",3,"#f0ca8f");

        ctx.strokeStyle="#96703f";
        ctx.lineWidth=4;

        ctx.beginPath();
        ctx.moveTo(x+7,y+7);
        ctx.lineTo(x+w-7,y+h-7);

        ctx.moveTo(x+w-7,y+7);
        ctx.lineTo(x+7,y+h-7);
        ctx.stroke();

        box(x+3,y+3,w-6,5,"#edc38a",2);
        box(x+3,y+h-8,w-6,5,"#98703f",2);

        for(const [xx,yy] of [
            [x+6,y+6],
            [x+w-6,y+6],
            [x+6,y+h-6],
            [x+w-6,y+h-6]
        ]){
            oval(xx,yy,2,2,"#67583f");
        }

        if(o.hp<o.maxHP){
            const ratio=clamp(o.hp/o.maxHP,0,1);

            box(x,y-9,w,4,"#576c4f",2);
            box(x,y-9,w*ratio,4,"#f5d184",2);

            ctx.strokeStyle="#836441";
            ctx.lineWidth=2;

            ctx.beginPath();
            ctx.moveTo(x+w*.25,y+h*.15);
            ctx.lineTo(x+w*.45,y+h*.43);
            ctx.lineTo(x+w*.3,y+h*.58);
            ctx.lineTo(x+w*.5,y+h*.82);
            ctx.stroke();
        }
    }
}

/* =================== XE TĂNG HOẠT HÌNH =================== */

function drawTankBody(t){
    ctx.save();
    ctx.translate(t.x,t.y);

    // Bóng dưới thân.
    oval(4,7,t.r+9,t.r+3,"#22463440");

    if(t.hurt>0){
        ctx.globalAlpha=.65+.25*Math.sin(time*70);
    }

    ctx.save();
    ctx.rotate(t.body);

    // Hai dải xích.
    for(const yy of [-24,14]){

function updateEffects(dt){
    if(!B)return;

    B.shake=Math.max(0,B.shake-dt*17);

    for(const p of B.particles){
        p.life-=dt;
        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        const drag=Math.pow(.1,dt);
        p.vx*=drag;p.vy*=drag;
    }

    B.particles=B.particles.filter(p=>p.life>0);

    for(const ring of B.rings){
        ring.life-=dt;
    }

    B.rings=B.rings.filter(r=>r.life>0);

    for(const label of B.labels){
        label.life-=dt;
        label.y-=29*dt;
    }

    B.labels=B.labels.filter(l=>l.life>0);

    // Giữ số lượng chữ hiệu ứng ở mức ổn định.
    if(B.labels.length>90){
        B.labels.splice(0,B.labels.length-90);
    }
}

function drawAim(){
    const p=B.player;

    if(!p.alive||B.finished||modal)return;

    if(input.auto){
        const target=nearestEnemy(p,true);

        if(!target||!visibleWorld(target.x,target.y,40))return;

        ctx.save();
        ctx.globalAlpha=.7;

        const r=target.r+11+Math.sin(time*6)*2;

        oval(target.x,target.y,r,r,null,"#fff0a0",1.5);

        ctx.strokeStyle="#fff0a0";
        ctx.lineWidth=2;

        for(let i=0;i<4;i++){
            const angle=i*Math.PI/2;
            const x1=target.x+Math.cos(angle)*(r-4);
            const y1=target.y+Math.sin(angle)*(r-4);
            const x2=target.x+Math.cos(angle)*(r+8);
            const y2=target.y+Math.sin(angle)*(r+8);

            ctx.beginPath();
            ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
            ctx.stroke();
        }

        ctx.restore();
        return;
    }

    const target={
        x:input.aimX,
        y:input.aimY
    };

    const maxDistance=560;
    const d=distance(p,target);
    const ratio=Math.min(1,maxDistance/Math.max(1,d));

    const endX=p.x+(target.x-p.x)*ratio;
    const endY=p.y+(target.y-p.y)*ratio;

    ctx.save();
    ctx.globalAlpha=.35;
    ctx.strokeStyle="#f0ffcf";
    ctx.lineWidth=1.5;
    ctx.setLineDash([6,9]);

    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(endX,endY);
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.globalAlpha=.85;

    oval(target.x,target.y,10,10,null,"#f5ffd4",2);

    ctx.strokeStyle="#f5ffd4";

    ctx.beginPath();
    ctx.moveTo(target.x-17,target.y);
    ctx.lineTo(target.x-6,target.y);
    ctx.moveTo(target.x+6,target.y);
    ctx.lineTo(target.x+17,target.y);
    ctx.moveTo(target.x,target.y-17);
    ctx.lineTo(target.x,target.y-6);
    ctx.moveTo(target.x,target.y+6);
    ctx.lineTo(target.x,target.y+17);
    ctx.stroke();

    ctx.restore();
}

function separateTanks(){
    // Tách nhẹ các xe bị chồng lên nhau, không đẩy xuyên tường.
    for(let i=0;i<B.tanks.length;i++){
        const a=B.tanks[i];
        if(!a.alive)continue;

        for(let j=i+1;j<B.tanks.length;j++){
            const b=B.tanks[j];
            if(!b.alive)continue;

            let dx=b.x-a.x;
            let dy=b.y-a.y;
            let d=Math.hypot(dx,dy);

            const minimum=(a.r+b.r)*.83;

            if(d>=minimum)continue;

            if(d<.001){
                dx=1;dy=0;d=1;
            }

            const push=Math.min(3,(minimum-d)*.5);
            const nx=dx/d,ny=dy/d;

            const ax=a.x-nx*push;
            const ay=a.y-ny*push;
            const bx=b.x+nx*push;
            const by=b.y+ny*push;

            if(!blocked(ax,ay,a.r)){
                a.x=ax;a.y=ay;
            }

            if(!blocked(bx,by,b.r)){
                b.x=bx;b.y=by;
            }
        }
    }
}

function updatePlayer(dt){
    const p=B.player;
    if(!p.alive)return;

    let dx=input.x;
    let dy=input.y;

    if(keys["a"]||keys["arrowleft"])dx-=1;
    if(keys["d"]||keys["arrowright"])dx+=1;
    if(keys["w"]||keys["arrowup"])dy-=1;
    if(keys["s"]||keys["arrowdown"])dy+=1;

    moveTank(p,dx,dy,dt);

    if(input.auto){
        const target=nearestEnemy(p,true);

        if(target){
            aimTank(p,target,dt,1);
        }else if(Math.hypot(p.vx,p.vy)>1){
            p.turret=lerpAngle(p.turret,p.body,dt*7);
        }
    }else{
        if(input.hasScreenAim){
            input.aimX=input.screenX+B.camera.x;
            input.aimY=input.screenY+B.camera.y;
        }

        const angle=Math.atan2(
            input.aimY-p.y,
            input.aimX-p.x
        );

        p.turret=lerpAngle(p.turret,angle,dt*20);
    }

    if(
        (input.fire||input.mouseFire||keys[" "])
        &&p.shotCD<=0
    ){
        shoot(p);
    }
}

function updateCamera(dt){
    const p=B.player;
    const targetX=clamp(p.x-W/2,0,MW-W);
    const targetY=clamp(p.y-H/2,0,MH-H);

    const blend=1-Math.exp(-dt*8);

    B.camera.x+=(targetX-B.camera.x)*blend;
    B.camera.y+=(targetY-B.camera.y)*blend;
}

function updateBattle(dt){
    if(!B)return;

    if(B.finished){
        updateEffects(dt);
        return;
    }

    // Mở menu tạm dừng toàn bộ trận và hồi chiêu.
    if(modal)return;

    B.elapsed+=dt;
    B.timer=Math.max(0,B.timer-dt);

    updateEffects(dt);

    for(const t of B.tanks){
        updateTankTimers(t,dt);
    }

    updatePlayer(dt);

    for(const t of B.tanks){
        if(!t.player&&t.alive){
            updateBot(t,dt);
        }
    }

    separateTanks();
    updateBullets(dt);
    updatePickups(dt);
    updateCamera(dt);
    checkEnd();
}

/* =================== VÒNG LẶP GAME =================== */

let lastFrame=performance.now();
let accumulator=0;
let uiClock=0;
let energyClock=0;

const STEP=1/90;

function frame(now){
    requestAnimationFrame(frame);

    const raw=(now-lastFrame)/1000;
    lastFrame=now;

    if(document.hidden){
        accumulator=0;
        return;
    }

    // Giới hạn bước thời gian, tránh nhảy vật lý khi trình duyệt bị khựng.
    const dt=clamp(raw,0,.06);

    time+=dt;
    uiClock+=dt;
    energyClock+=dt;

    if(energyClock>=5){
        energyClock=0;
        regen();
    }

    if(toastEnd>0&&now>=toastEnd){
        $("toast").style.opacity=0;
        toastEnd=0;
    }

    if(scene==="battle"&&B){
        accumulator+=dt;
        let steps=0;

        while(accumulator>=STEP&&steps<7){
            updateBattle(STEP);
            accumulator-=STEP;
            steps++;

            if(scene!=="battle"||!B){
                accumulator=0;
                break;
            }
        }

        if(steps>=7){
            accumulator=Math.min(accumulator,STEP);
        }
    }else{
        accumulator=0;
    }

    if(uiClock>=.1){
        uiClock=0;

        if(scene==="battle"&&B){
            updateBattleUI();
        }
    }

    ctx.clearRect(0,0,W,H);

    if(scene==="lobby"){
        drawLobby();
    }else if(scene==="battle"&&B){
        drawBattle();
    }
}

/* =================== KHỞI ĐỘNG VÀ LƯU =================== */

addEventListener("pagehide",save);

document.addEventListener("visibilitychange",()=>{
    if(!document.hidden){
        lastFrame=performance.now();
        accumulator=0;
        regen();
    }
});

document.addEventListener("webkitfullscreenchange",fit);

});

$("joystick").addEventListener("contextmenu",event=>{
    event.preventDefault();
});

$("fire").addEventListener("contextmenu",event=>{

});

hud();
